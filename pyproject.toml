[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-3d-prelabel"
version = "0.1.0"
description = "nuScenes / CenterPoint / CVAT 3D pre-label and evaluation pipeline"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "PyYAML==6.0.2", "requests==2.32.3"]

[project.optional-dependencies]
dataset = ["nuscenes-devkit==1.1.11", "matplotlib==3.5.3", "Shapely==1.8.5.post1"]
test = ["pytest==8.3.5"]

[project.scripts]
prelabel = "prelabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: requires an explicitly enabled live CVAT server", "detector: requires pinned MMDetection3D"]
